<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Same design as ParadoxOrb.tsx, self-contained: a favicon is fetched and
    rendered as its own document, so this carries every animation as native
    SMIL rather than relying on a linked stylesheet.
  -->
  <defs>
    <radialGradient id="coreFill" cx="42%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#20242c" />
      <stop offset="45%" stop-color="#0a0c11" />
      <stop offset="100%" stop-color="#020204" />
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6fd8ff" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#8b6bff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8b6bff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ribbon" gradientUnits="userSpaceOnUse" x1="20" y1="50" x2="80" y2="50">
      <stop offset="0%" stop-color="#2be2ff" />
      <stop offset="18%" stop-color="#4a7dff" />
      <stop offset="36%" stop-color="#8a5cff" />
      <stop offset="54%" stop-color="#c150ec" />
      <stop offset="70%" stop-color="#ff4fc7" />
      <stop offset="85%" stop-color="#ff9bd6" />
      <stop offset="94%" stop-color="#ffb27a" />
      <stop offset="100%" stop-color="#2be2ff" />
      <animateTransform attributeName="gradientTransform" type="rotate"
                         from="0 50 50" to="360 50 50" dur="10s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="blurSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1" />
    </filter>
    <filter id="blurHalo" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <clipPath id="coreClip">
      <circle cx="50" cy="50" r="12.5" />
    </clipPath>
  </defs>

  <circle cx="50" cy="50" r="24" fill="url(#halo)" filter="url(#blurHalo)">
    <!-- Animating r (not a scale transform) keeps this centered on (50,50) —
         transform-based scaling in raw SVG pivots at (0,0), not the element,
         and would make the halo drift instead of breathe in place. -->
    <animate attributeName="r" values="24;26.9;24" dur="4.6s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" />
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4.6s" repeatCount="indefinite" />
  </circle>

  <g opacity="0.55" filter="url(#blurSoft)">
    <g transform="rotate(0 50 50)">
      <animateTransform attributeName="transform" type="rotate" additive="sum"
                         from="0 50 50" to="360 50 50" dur="9s" repeatCount="indefinite" />
      <ellipse cx="50" cy="50" rx="22" ry="9" fill="none" stroke="url(#ribbon)"
               stroke-width="1.7" stroke-linecap="round">
        <animate attributeName="rx" values="22;24.5;20.5;22" dur="15s" repeatCount="indefinite" />
        <animate attributeName="ry" values="9;7.5;10.5;9" dur="15s" repeatCount="indefinite" />
      </ellipse>
    </g>
    <g transform="rotate(120 50 50)">
      <animateTransform attributeName="transform" type="rotate" additive="sum"
                         from="0 50 50" to="-360 50 50" dur="13s" repeatCount="indefinite" />
      <ellipse cx="50" cy="50" rx="25" ry="7" fill="none" stroke="url(#ribbon)"
               stroke-width="1.7" stroke-linecap="round">
        <animate attributeName="rx" values="25;22.5;27;25" dur="18s" repeatCount="indefinite" />
        <animate attributeName="ry" values="7;9;5.5;7" dur="18s" repeatCount="indefinite" />
      </ellipse>
    </g>
    <g transform="rotate(240 50 50)">
      <animateTransform attributeName="transform" type="rotate" additive="sum"
                         from="0 50 50" to="360 50 50" dur="16s" repeatCount="indefinite" />
      <ellipse cx="50" cy="50" rx="19" ry="11" fill="none" stroke="url(#ribbon)"
               stroke-width="1.7" stroke-linecap="round">
        <animate attributeName="rx" values="19;21;17.5;19" dur="12s" repeatCount="indefinite" />
        <animate attributeName="ry" values="11;9;12.5;11" dur="12s" repeatCount="indefinite" />
      </ellipse>
    </g>
  </g>

  <g>
    <circle cx="50" cy="50" r="12.5" fill="url(#coreFill)">
      <animate attributeName="r" values="12.5;12.94;12.5" dur="4.6s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" />
    </circle>
    <circle cx="50" cy="50" r="12.5" fill="none" stroke="url(#ribbon)"
            stroke-opacity="0.5" stroke-width="0.6">
      <animate attributeName="r" values="12.5;12.94;12.5" dur="4.6s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" />
    </circle>
    <g>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="4.6s" repeatCount="indefinite" />
      <rect x="44.4" y="46.3" width="2.1" height="7.4" rx="1.05" fill="#bff3ff" />
      <rect x="53.5" y="46.3" width="2.1" height="7.4" rx="1.05" fill="#bff3ff" />
    </g>
  </g>

  <g opacity="0.95" clip-path="url(#coreClip)">
    <g transform="rotate(0 50 50)">
      <animateTransform attributeName="transform" type="rotate" additive="sum"
                         from="0 50 50" to="360 50 50" dur="9s" repeatCount="indefinite" />
      <ellipse cx="50" cy="50" rx="22" ry="9" fill="none" stroke="url(#ribbon)"
               stroke-width="1.7" stroke-linecap="round">
        <animate attributeName="rx" values="22;24.5;20.5;22" dur="15s" repeatCount="indefinite" />
        <animate attributeName="ry" values="9;7.5;10.5;9" dur="15s" repeatCount="indefinite" />
      </ellipse>
    </g>
    <g transform="rotate(120 50 50)">
      <animateTransform attributeName="transform" type="rotate" additive="sum"
                         from="0 50 50" to="-360 50 50" dur="13s" repeatCount="indefinite" />
      <ellipse cx="50" cy="50" rx="25" ry="7" fill="none" stroke="url(#ribbon)"
               stroke-width="1.7" stroke-linecap="round">
        <animate attributeName="rx" values="25;22.5;27;25" dur="18s" repeatCount="indefinite" />
        <animate attributeName="ry" values="7;9;5.5;7" dur="18s" repeatCount="indefinite" />
      </ellipse>
    </g>
    <g transform="rotate(240 50 50)">
      <animateTransform attributeName="transform" type="rotate" additive="sum"
                         from="0 50 50" to="360 50 50" dur="16s" repeatCount="indefinite" />
      <ellipse cx="50" cy="50" rx="19" ry="11" fill="none" stroke="url(#ribbon)"
               stroke-width="1.7" stroke-linecap="round">
        <animate attributeName="rx" values="19;21;17.5;19" dur="12s" repeatCount="indefinite" />
        <animate attributeName="ry" values="11;9;12.5;11" dur="12s" repeatCount="indefinite" />
      </ellipse>
    </g>
  </g>

  <g fill="#dff6ff">
    <circle r="0.8" opacity="0">
      <animateMotion dur="9s" begin="0s" repeatCount="indefinite"
                     path="M 28 50 A 22 9 0 1 0 72 50 A 22 9 0 1 0 28 50" rotate="auto" />
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.08;0.85;1"
               dur="9s" begin="0s" repeatCount="indefinite" />
    </circle>
    <circle r="0.65" opacity="0">
      <animateMotion dur="13s" begin="-4s" repeatCount="indefinite"
                     path="M 25 50 A 25 7 0 1 0 75 50 A 25 7 0 1 0 25 50" rotate="auto" />
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.08;0.85;1"
               dur="13s" begin="-4s" repeatCount="indefinite" />
    </circle>
    <circle r="0.9" opacity="0">
      <animateMotion dur="16s" begin="-8s" repeatCount="indefinite"
                     path="M 31 50 A 19 11 0 1 0 69 50 A 19 11 0 1 0 31 50" rotate="auto" />
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.08;0.85;1"
               dur="16s" begin="-8s" repeatCount="indefinite" />
    </circle>
    <circle cx="24" cy="30" r="0.7" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 -3;0 0"
                         dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="76" cy="66" r="0.6" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0;-2.5 2;0 0"
                         dur="9.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.85;0.3" dur="9.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="72" cy="28" r="0.55" opacity="0.35">
      <animateTransform attributeName="transform" type="translate" values="0 0;1.5 2.5;0 0"
                         dur="8.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.35;0.8;0.35" dur="8.2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
