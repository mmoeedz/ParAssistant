[project]
name = "paradox-agent"
version = "0.1.0"
description = "The Paradox agent: a Windows computer assistant that decides how to do what you ask."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "websockets>=13",
    "python-dotenv>=1.0",
    "mss>=9.0",
    "Pillow>=10.0",
    "psutil>=6.0",
    "pywin32>=306; sys_platform == 'win32'",
    "uiautomation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Media>=3.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The agent runs on any one of these. Install the extra for the key you have;
# `pip install -e ".[all]"` pulls all three.
openai = ["openai>=1.60"]
google = ["google-genai>=0.8"]
all = ["openai>=1.60", "google-genai>=0.8"]

[project.scripts]
paradox = "paradox.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["paradox*"]
